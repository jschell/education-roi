[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "education-roi"
version = "0.1.0"
description = "Reproducible analysis of education and career pathway returns"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Education ROI contributors" }]
dependencies = ["typer>=0.16,<1"]

[project.scripts]
edu-roi = "education_roi.cli.app:app"

[dependency-groups]
dev = ["build>=1.2,<2", "mypy>=1.15,<2", "pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/education_roi"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

